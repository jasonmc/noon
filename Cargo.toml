[package]
name = "noon"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
cities-json = "0.6.8"
iso_country = "0.1.4"
strsim = "0.11"
tzf-rs = { version = "1.3.3", default-features = false, features = ["bundled"] }
